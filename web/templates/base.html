<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Voice Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#7afdd6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    /* ── DESIGN TOKENS ──────────────────────────────────────── */
    :root {
      --bg:        #07070f;
      --surface:   #0e0e1c;
      --border:    rgba(122, 253, 214, 0.12);
      --border-h:  rgba(122, 253, 214, 0.35);
      --mint:      #7afdd6;
      --mint-dim:  rgba(122, 253, 214, 0.15);
      --red:       #ff5f7e;
      --amber:     #ffcc00;
      --text:      #c8d8e8;
      --muted:     #4a5568;
      --mono:      'Space Mono', monospace;
      --sans:      'Syne', sans-serif;
      --radius:    6px;
      --glow:      0 0 18px rgba(122, 253, 214, 0.18);
    }

    /* ── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: var(--mint); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── SCANLINE OVERLAY ───────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── TOPBAR ─────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,14,28,0.95);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo {
      font-family: var(--sans);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--mint);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-logo span { color: var(--text); font-weight: 400; }
    .topbar-logo::before {
      content: '◈';
      font-size: 1.2rem;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .topbar-nav { display: flex; gap: 6px; }
    .nav-btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      transition: all 0.2s;
    }
    .nav-btn:hover {
      border-color: var(--mint);
      color: var(--mint);
      background: var(--mint-dim);
    }
    .nav-btn.primary {
      border-color: var(--mint);
      color: var(--mint);
    }
    .nav-btn.primary:hover {
      background: var(--mint);
      color: var(--bg);
    }

    /* ── MAIN LAYOUT ────────────────────────────────────────── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 16px;
    }

    /* ── PAGE HEADER ────────────────────────────────────────── */
    .page-header {
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-family: var(--sans);
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .page-header p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* ── STATUS BADGES ──────────────────────────────────────── */
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-created   { background: rgba(74,85,104,0.4);  color: #8899aa; border: 1px solid #4a5568; }
    .badge-processing{ background: rgba(255,204,0,0.15); color: var(--amber); border: 1px solid rgba(255,204,0,0.35); }
    .badge-ready     { background: var(--mint-dim);      color: var(--mint); border: 1px solid var(--border-h); }
    .badge-failed    { background: rgba(255,95,126,0.15);color: var(--red);  border: 1px solid rgba(255,95,126,0.3); }

    /* ── CARD ───────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: var(--border-h); box-shadow: var(--glow); }

    /* ── BUTTON ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 7px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--mint); color: var(--mint); background: var(--mint-dim); }
    .btn-primary { border-color: var(--mint); color: var(--mint); }
    .btn-primary:hover { background: var(--mint); color: var(--bg); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(255,95,126,0.15); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── TOAST ──────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 20px;
      font-size: 0.8rem; padding: 10px 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--mint);
      opacity: 0; transform: translateY(10px);
      transition: all 0.3s; pointer-events: none; z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── WAVEFORM DECO ──────────────────────────────────────── */
    .waveform-deco {
      display: flex; align-items: flex-end; gap: 2px;
      height: 20px;
    }
    .waveform-deco span {
      display: block; width: 3px;
      background: var(--mint);
      border-radius: 2px;
      opacity: 0.5;
      animation: wave var(--d, 1s) ease-in-out infinite alternate;
    }
    @keyframes wave { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

    /* ── UTILITIES ──────────────────────────────────────────── */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mt-6 { margin-top: 24px; }
    .text-muted { color: var(--muted); font-size: 0.8rem; }
    .text-mint { color: var(--mint); }
    .mono { font-family: var(--mono); }

    @media (max-width: 600px) {
      .topbar { padding: 10px 14px; }
      .container { padding: 18px 12px; }
      .page-header h1 { font-size: 1.3rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="topbar-logo">
      VOICE STUDIO <span>// MVP</span>
    </a>
    <nav class="topbar-nav">
      <a href="/"><button class="nav-btn">Проекты</button></a>
      <a href="/upload"><button class="nav-btn primary">+ Загрузить</button></a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast"></div>

  <script>
    function showToast(msg, ok = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.color = ok ? 'var(--mint)' : 'var(--red)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
          .catch(err => console.warn('[SW] registration failed:', err));
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
